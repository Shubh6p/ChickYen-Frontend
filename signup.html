<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Signup | ChickYen Achar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="assets/favicon.png">

    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #FFFBF7; /* Consistent branding color */
        }
        .signup-glass {
            background-color: rgba(255, 248, 240, 0.85); 
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(234, 88, 12, 0.1);
            box-shadow: 0 4px 30px rgba(234, 88, 12, 0.05);
        }
        /* Custom scrollbar for the address textarea */
        textarea::-webkit-scrollbar { width: 4px; }
        textarea::-webkit-scrollbar-thumb { background: #ea580c; border-radius: 10px; }

        /* Modal Overlay */
.modal-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(4px);
    display: none; /* Hidden by default */
    align-items: center;
    justify-content: center;
    z-index: 10000;
}

/* Modal Box */
.modal-content {
    background: white;
    padding: 40px;
    border-radius: 24px;
    text-align: center;
    max-width: 350px;
    width: 90%;
    transform: scale(0.8);
    transition: transform 0.3s ease;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
}

.modal-overlay.active {
    display: flex;
}

.modal-overlay.active .modal-content {
    transform: scale(1);
}

/* Success Icon Animation */
.success-icon {
    width: 80px;
    height: 80px;
    background: #fffaf7;
    border: 3px solid #ea580c;
    border-radius: 50%;
    margin: 0 auto 20px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
}

.check-mark {
    width: 30px;
    height: 15px;
    border-left: 5px solid #ea580c;
    border-bottom: 5px solid #ea580c;
    transform: rotate(-45deg);
    margin-top: -5px;
}

/* Typography */
.modal-content h2 {
    color: #111827;
    margin-bottom: 10px;
    font-size: 24px;
    font-weight: 800;
}

.modal-content p {
    color: #6b7280;
    font-size: 15px;
    line-height: 1.5;
}

/* Auto-close Progress Bar */
.progress-bar {
    width: 100%;
    height: 4px;
    background: #f3f4f6;
    margin-top: 30px;
    border-radius: 2px;
    overflow: hidden;
}

.progress-fill {
    height: 100%;
    background: #ea580c;
    width: 100%;
    animation: shrink 3s linear forwards;
}

@keyframes shrink {
    from { width: 100%; }
    to { width: 0%; }
}
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 py-12">

    <div class="signup-glass w-full max-w-md p-8 sm:p-10 rounded-[2.5rem] text-center shadow-2xl">
        <div class="mb-8">
            <span class="text-orange-600 font-bold tracking-[0.2em] uppercase text-xs">Join the Jar</span>
            <h2 class="text-3xl font-black text-gray-900 mt-2">Create <span class="text-orange-600">Account</span></h2>
        </div>

        <form id="signupForm" class="space-y-4">
            <div id="emailSection" class="space-y-4">
                <div class="text-left">
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-4 mb-1 block">Email Address</label>
                    <div class="relative">
                        <input type="email" id="email" placeholder="Enter your email" 
                            class="w-full bg-white border border-orange-100 px-6 py-4 rounded-2xl focus:ring-2 focus:ring-orange-600 outline-none transition-all" required />
                        <button type="button" onclick="sendOTP('email')" id="sendEmailBtn"
                            class="absolute right-2 top-2 bg-gray-900 text-white text-[10px] font-bold px-4 py-2.5 rounded-xl hover:bg-orange-600 transition-all uppercase tracking-widest">
                            Send OTP
                        </button>
                    </div>
                </div>

                <div id="otpInputGroup" class="hidden animate-fade-in space-y-4">
                    <div class="text-left">
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-4 mb-1 block">Verify Code</label>
                        <input type="text" id="emailOtp" placeholder="Enter 6-digit OTP" 
                            class="w-full bg-white border border-orange-100 px-6 py-4 rounded-2xl focus:ring-2 focus:ring-orange-600 outline-none transition-all tracking-[0.5em] text-center font-bold" />
                    </div>
                    <button type="button" onclick="verifyOTP('email')" 
                        class="w-full bg-orange-600 text-white font-bold py-4 rounded-2xl hover:bg-black transition-all shadow-lg uppercase tracking-widest text-sm">
                        Verify Email
                    </button>
                </div>
            </div>

            <div id="passwordSection" class="hidden animate-fade-in space-y-4 mt-6">
                <div class="text-left">
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-widest ml-4 mb-1 block">Create a new Password</label>
                    <div class="relative">
                        <input type="password" id="password" placeholder="••••••••" 
                            class="w-full bg-white border border-orange-100 px-6 py-4 rounded-2xl focus:ring-2 focus:ring-orange-600 outline-none transition-all placeholder:text-gray-300 pr-12" required />
                        
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-orange-600 transition-colors">
                            <i id="toggleIcon" class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" 
                    class="w-full bg-gray-900 text-white font-bold py-4 rounded-2xl hover:bg-orange-600 transition-all shadow-lg active:scale-95 uppercase tracking-widest text-sm">
                    Create Account
                </button>
            </div>
        </form>

        <p id="error" class="mt-4 text-xs font-bold text-red-500 min-h-[1rem]"></p>

        <div id="detailsPopup" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/60 backdrop-blur-md hidden px-4 transition-all duration-500">
            <div class="bg-[#FFF8F0] w-full max-w-sm p-8 rounded-[3rem] shadow-2xl border-4 border-white text-center relative overflow-hidden">
                
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-orange-100 rounded-full blur-3xl opacity-50"></div>

                <div class="mb-8 relative">
                    <div class="inline-flex items-center justify-center p-1 rounded-full bg-orange-50 mb-4">
                        <span class="text-orange-600 font-black tracking-widest uppercase text-[10px] px-4 py-1">Step 2 of 2</span>
                    </div>
                    <h3 class="text-2xl font-black text-gray-900 mt-1">Final <span class="text-orange-600">Details</span></h3>
                    <p class="text-gray-400 text-[10px] font-bold uppercase tracking-tighter mt-1">Almost there! Complete your profile.</p>
                </div>
                
                <div class="space-y-4">
                    <div class="relative group">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 group-focus-within:text-orange-500 transition-colors">👤</span>
                        <input id="name" type="text" placeholder="Full Name" 
                            class="w-full bg-white border border-orange-100 pl-11 pr-5 py-4 rounded-2xl outline-none focus:ring-4 focus:ring-orange-500/10 focus:border-orange-600 transition-all font-bold placeholder:text-gray-300" />
                    </div>
                    
                    <div class="relative group">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-300 group-focus-within:text-orange-500 transition-colors">📞</span>
                        <input id="phone" type="tel" placeholder="Phone Number" 
                            class="w-full bg-white border border-orange-100 pl-11 pr-24 py-4 rounded-2xl outline-none focus:ring-4 focus:ring-orange-500/10 focus:border-orange-600 transition-all font-bold placeholder:text-gray-300" />
                    </div>

                    <div id="mobileOtpGroup" class="hidden animate-bounce-in">
                        <input id="mobileOtp" type="text" placeholder="Enter Mobile OTP" 
                            class="w-full bg-white border-2 border-dashed border-orange-200 px-5 py-3 rounded-2xl outline-none focus:border-orange-600 text-center tracking-[0.5em] font-black text-orange-600" />
                    </div>
                    
                    <div class="relative group">
                        <span class="absolute left-4 top-5 text-gray-300 group-focus-within:text-orange-500 transition-colors">📍</span>
                        <textarea id="address" rows="3" placeholder="Primary Delivery Address..." 
                            class="w-full bg-white border border-orange-100 pl-11 pr-5 py-4 rounded-2xl outline-none focus:ring-4 focus:ring-orange-500/10 focus:border-orange-600 transition-all font-bold placeholder:text-gray-300 resize-none custom-scrollbar"></textarea>
                    </div>
                </div>

                <button id="completeSetupBtn" onclick="saveDetailsWithAnimation()" 
                    class="w-full mt-8 bg-orange-600 text-white font-black py-5 rounded-[2rem] shadow-xl shadow-orange-200 hover:bg-black hover:-translate-y-1 active:scale-95 transition-all uppercase tracking-widest text-xs flex items-center justify-center gap-2">
                    <span>Complete Setup</span>
                    <span class="text-lg">→</span>
                </button>
            </div>
        </div>

        <div class="mt-8 pt-6 border-t border-orange-100/50">
            <p class="text-gray-500 text-sm">
                Already have an account? 
                <a href="login.html" class="text-orange-600 font-bold hover:underline ml-1">Login here</a>
            </p>
        </div>
    </div>

    <div id="successModal" class="modal-overlay">
    <div class="modal-content">
        <div class="success-icon">
            <div class="check-mark"></div>
        </div>
        <h2 id="modalTitle">OTP Sent!</h2>
        <p id="modalMessage">Please check your email for the verification code.</p>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
    </div>
</div>

    <script src="customer-auth.js"></script>
</body>
</html>
